<svg xmlns="http://www.w3.org/2000/svg" width="680" height="576" viewBox="0 0 680 576"><rect width="680" height="576" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="220" y="30" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441">Java codebase</text><text x="340.0" y="70.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">186 files from GitHub</text><line x1="340" y1="86" x2="340" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="126" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="144.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">1. Read the files</text><text x="340.0" y="166.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">skip tests and build junk</text><line x1="340" y1="182" x2="340" y2="216" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="222" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">2. Find the structure</text><text x="340.0" y="262.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">classes, methods, roles</text><line x1="340" y1="278" x2="340" y2="312" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="318" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="336.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">3. Measure complexity</text><text x="340.0" y="358.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">count decisions per method</text><line x1="340" y1="374" x2="340" y2="408" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="414" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/><text x="340.0" y="432.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#633806">4. Ask Claude</text><text x="340.0" y="454.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#854F0B">describe classes in batches</text><line x1="340" y1="470" x2="340" y2="504" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="510" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340.0" y="528.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441">knowledge.json</text><text x="340.0" y="550.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">one structured output file</text></svg>